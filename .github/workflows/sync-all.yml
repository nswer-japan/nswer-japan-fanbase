name: Sync All Site Data
"on":
  workflow_dispatch:
  schedule:
    - cron: "42 18 * * *"
permissions:
  contents: write
concurrency:
  group: nswer-content-write
  cancel-in-progress: false
jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install -U pillow pillow-heif --pre "yt-dlp[default]"
      - name: Sync Notion without deleting previous data
        continue-on-error: true
        env:
          NSWER_NOTION_TOKEN: ${{ secrets.NSWER_NOTION_TOKEN }}
          NSWER_NOTION_NEWS_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_NEWS_DATA_SOURCE_ID }}
          NSWER_NOTION_SCHEDULE_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_SCHEDULE_DATA_SOURCE_ID }}
          NSWER_NOTION_MEMBERS_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_MEMBERS_DATA_SOURCE_ID }}
          NSWER_NOTION_DISCOGRAPHY_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_DISCOGRAPHY_DATA_SOURCE_ID }}
          NSWER_NOTION_MUSIC_SHOW_WINS_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_MUSIC_SHOW_WINS_DATA_SOURCE_ID }}
          NSWER_NOTION_CHARTS_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_CHARTS_DATA_SOURCE_ID }}
          NSWER_NOTION_GUIDES_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_GUIDES_DATA_SOURCE_ID }}
          NSWER_NOTION_OFFICIAL_LINKS_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_OFFICIAL_LINKS_DATA_SOURCE_ID }}
          NSWER_NOTION_HOMEPAGE_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_HOMEPAGE_DATA_SOURCE_ID }}
          NSWER_NOTION_SITE_THEME_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_SITE_THEME_DATA_SOURCE_ID }}
          NSWER_NOTION_COMEBACK_THEMES_DATA_SOURCE_ID: ${{ vars.NSWER_NOTION_COMEBACK_THEMES_DATA_SOURCE_ID }}
        run: python scripts/sync-notion-content.py
      - name: Sync YouTube without deleting previous data
        continue-on-error: true
        env:
          YOUTUBE_SYNC_MODE: auto
          YOUTUBE_TAB_RETRIES: "3"
          YOUTUBE_TAB_TIMEOUT_MS: "1200000"
        run: node scripts/sync-youtube-channels.mjs
      - name: Generate all content
        run: python3 scripts/build-content.py
      - name: Validate all content
        run: python3 scripts/validate-site.py
      - name: Commit once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: full site sync"
          git push
