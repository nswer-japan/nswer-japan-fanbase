name: Sync All Site Data
"on":
  workflow_dispatch:
    inputs:
      full_youtube_history:
        description: "YouTube全公開履歴を再取得する"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "42 18 * * *"
permissions:
  contents: write
concurrency:
  group: nswer-content-write
  cancel-in-progress: false
jobs:
  sync-all:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install build and YouTube dependencies
        run: python -m pip install -U pillow --pre "yt-dlp[default]"
      - name: Select YouTube mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_youtube_history }}
        run: |
          mode="recent"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_HISTORY" == "true" ]]; then
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Sync YouTube without deleting previous data
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_SYNC_MODE: ${{ steps.mode.outputs.mode }}
          YOUTUBE_TAB_RETRIES: "3"
          YOUTUBE_TAB_TIMEOUT_MS: "1200000"
        run: node scripts/sync-youtube-channels.mjs
      - name: Keep previous YouTube data on failure
        if: steps.youtube.outcome == 'failure'
        run: echo "YouTube fetch failed; previous repository data remains unchanged."
      - name: Generate all repository content
        run: python3 scripts/build-content.py
      - name: Validate generated site
        run: |
          python3 scripts/validate-site.py
          python3 scripts/check-site-links.py
          python3 scripts/test-youtube-sync.py
      - name: Commit once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: refresh repository content"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
