name: Sync YouTube

"on":
  push:
    branches: [main]
    paths:
      - "scripts/sync-youtube-channels.mjs"
      - "scripts/test-youtube-sync.py"
      - ".github/workflows/sync-youtube.yml"
      - "data/youtube-channels.json"
  workflow_dispatch:
    inputs:
      full_history:
        description: "動画・ショート・ライブの全公開履歴を再取得する"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 3 * * 0"

permissions:
  contents: write

concurrency:
  group: nswer-content-write
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install -U --pre "yt-dlp[default]" Pillow

      - name: Verify YouTube sync implementation
        run: python3 scripts/test-youtube-sync.py

      - name: Select sync mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          mode="recent"
          if [[ "$EVENT_NAME" == "push" ]]; then
            mode="auto"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$FULL_HISTORY" == "true" ]]; then
            mode="full"
          elif [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "43 3 * * 0" ]]; then
            mode="full"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "YouTube sync mode: $mode"

      - name: Fetch videos, Shorts and live streams
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_SYNC_MODE: ${{ steps.mode.outputs.mode }}
          YOUTUBE_TAB_RETRIES: "3"
          YOUTUBE_TAB_TIMEOUT_MS: "1200000"
        run: node scripts/sync-youtube-channels.mjs

      - name: Keep previous data on failure
        if: steps.youtube.outcome == 'failure'
        run: echo "YouTube fetch failed; previous JSON remains unchanged."

      - name: Build and validate
        run: python3 scripts/build-content.py && python3 scripts/validate-site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-channels.json data/search-index.json service-worker.js sitemap.xml assets/ogp articles '*.html'
          git diff --cached --quiet || git commit -m "chore: sync NMIXX YouTube categories"
          git push
