name: Check Site
"on":
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install pillow
      - run: python3 scripts/build-content.py
      - run: python3 scripts/validate-site.py
      - run: python3 scripts/check-site-links.py
      - run: |
          for file in js/*.js data/*-data.js service-worker.js; do node --check "$file"; done
          for file in scripts/*.mjs; do node --check "$file"; done
          python3 -m compileall -q scripts
          python3 scripts/test-youtube-sync.py
