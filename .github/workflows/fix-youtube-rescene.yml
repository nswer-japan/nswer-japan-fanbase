name: Fix YouTube Legacy Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-youtube-legacy-data
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip Pillow

      - name: Remove legacy RESCENE data from YouTube JSON
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("data/youtube-channels.json")
          if not path.exists():
              raise SystemExit(f"Missing file: {path}")

          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = re.compile(r"rescene|\bwoni\b", re.IGNORECASE)
          removed_channels = 0
          removed_videos = 0
          removed_fields = 0

          def contains_forbidden(value):
              if isinstance(value, str):
                  return bool(forbidden.search(value))
              if isinstance(value, list):
                  return any(contains_forbidden(item) for item in value)
              if isinstance(value, dict):
                  return any(contains_forbidden(k) or contains_forbidden(v) for k, v in value.items())
              return False

          def clean_generic(value):
              global removed_fields
              if isinstance(value, list):
                  cleaned = []
                  for item in value:
                      if isinstance(item, str) and forbidden.search(item):
                          removed_fields += 1
                          continue
                      cleaned.append(clean_generic(item))
                  return cleaned
              if isinstance(value, dict):
                  cleaned = {}
                  for key, item in value.items():
                      if forbidden.search(str(key)):
                          removed_fields += 1
                          continue
                      if isinstance(item, str) and forbidden.search(item):
                          removed_fields += 1
                          continue
                      cleaned[key] = clean_generic(item)
                  return cleaned
              return value

          channels = data.get("channels", [])
          cleaned_channels = []
          identity_fields = ("key", "label", "handle", "channelId", "url", "description", "feedUrl")

          for channel in channels if isinstance(channels, list) else []:
              if not isinstance(channel, dict):
                  continue

              identity = {key: channel.get(key) for key in identity_fields}
              if contains_forbidden(identity):
                  removed_channels += 1
                  continue

              videos = channel.get("videos", [])
              clean_videos = []
              for video in videos if isinstance(videos, list) else []:
                  if contains_forbidden(video):
                      removed_videos += 1
                      continue
                  clean_videos.append(clean_generic(video))

              channel = clean_generic({k: v for k, v in channel.items() if k != "videos"})
              channel["videos"] = clean_videos
              channel["totalVideos"] = len(clean_videos)
              type_counts = {"video": 0, "short": 0, "live": 0}
              for video in clean_videos:
                  kind = str(video.get("videoType", "video"))
                  if kind not in type_counts:
                      kind = "video"
                  type_counts[kind] += 1
              channel["typeCounts"] = type_counts
              cleaned_channels.append(channel)

          data = clean_generic({k: v for k, v in data.items() if k != "channels"})
          data["channels"] = cleaned_channels
          data["historyComplete"] = False
          data["collectionMode"] = "legacy-data-cleaned-before-full-history"

          rendered = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          if forbidden.search(rendered):
              for line_no, line in enumerate(rendered.splitlines(), 1):
                  if forbidden.search(line):
                      print(f"Remaining forbidden text at line {line_no}: {line}")
              raise SystemExit("Forbidden legacy text still remains")

          path.write_text(rendered, encoding="utf-8")
          print(f"Removed channels: {removed_channels}")
          print(f"Removed videos: {removed_videos}")
          print(f"Removed fields: {removed_fields}")
          print("YouTube JSON no longer contains RESCENE/WONI.")
          PY

      - name: Show verification result
        shell: bash
        run: |
          if grep -Ein 'rescene|\bWONI\b' data/youtube-channels.json; then
            echo "Forbidden legacy text remains."
            exit 1
          fi
          echo "Legacy YouTube data check passed."

      - name: Build and validate site
        run: python3 scripts/build-content.py && python3 scripts/validate-site.py

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/fix-youtube-rescene.yml

      - name: Commit repaired data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: remove legacy YouTube data"
          git push
