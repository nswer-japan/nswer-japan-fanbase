name: Build Repository Content
"on":
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "docs/**"
      - "assets/**"
      - "templates/**"
      - "scripts/**"
      - "js/**"
      - "css/**"
      - "*.html"
      - "manifest.webmanifest"
      - "CNAME"
permissions:
  contents: write
concurrency:
  group: nswer-content-write
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip Pillow
      - run: python3 scripts/build-content.py
      - run: python3 scripts/validate-site.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "build: refresh site content"
          git push
